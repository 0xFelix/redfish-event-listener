{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redfish-event-listener.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redfish-event-listener.labels" . | nindent 4 }}
type: Opaque
stringData:
  insecure: {{ .Values.secret.insecure | toString | quote }}
  destinationURL: {{ required "secret.destinationURL is required when secret.create is true" .Values.secret.destinationURL | quote }}
{{- end }}
